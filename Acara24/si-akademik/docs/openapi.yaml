openapi: 3.0.0
info:
  title: API Sistem Informasi Akademik (MVC)
  description: >
    RESTful API data mahasiswa dan autentikasi pengguna, dibangun dengan
    PHP Native (pola MVC, Router, Front Controller) dan database MySQL
    si_akademik. Endpoint yang bertanda gembok memerlukan header
    Authorization Bearer token (JWT HS256, masa berlaku 5 menit).
  version: 1.0.0
servers:
  - url: http://localhost/Web_Server/Acara22/si-akademik/public
    description: Server lokal (XAMPP)

tags:
  - name: Autentikasi
    description: Registrasi dan login (AuthController)
  - name: Mahasiswa
    description: CRUD data mahasiswa (MahasiswaController)

paths:
  /register:
    post:
      tags: [Autentikasi]
      summary: Pendaftaran pengguna baru (AuthController::register)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: user01
              email: user01@example.com
              password: rahasia123
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                success: true
                message: Registrasi berhasil
                data: { id: 10 }
                timestamp: '2026-10-30T10:00:00+07:00'
        '400':
          description: Username, email, atau password belum diisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Username, email, dan password wajib diisi
                data: null
                timestamp: '2026-10-30T10:00:00+07:00'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          description: Format email tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Validasi data gagal
                data: null
                errors: { email: Format email tidak valid }
                timestamp: '2026-10-30T10:00:00+07:00'

  /login:
    post:
      tags: [Autentikasi]
      summary: Autentikasi pengguna (AuthController::login)
      description: Menghasilkan token JWT (HS256) yang berlaku selama 5 menit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: rahasia123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                message: Login berhasil
                data:
                  token: eyJhbGciOiJIUzI1NiIs...
                  role: user
                timestamp: '2026-10-30T10:00:00+07:00'
        '401':
          description: Username atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Username atau password salah
                data: null
                timestamp: '2026-10-30T10:00:00+07:00'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /mahasiswa:
    get:
      tags: [Mahasiswa]
      summary: Mengambil data mahasiswa (MahasiswaController::index)
      description: >
        Tanpa parameter id, mengembalikan seluruh mahasiswa.
        Dengan parameter id, mengembalikan satu mahasiswa.
      parameters:
        - name: id
          in: query
          required: false
          description: ID mahasiswa
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Data berhasil diambil
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MahasiswaListResponse'
                  - $ref: '#/components/schemas/MahasiswaDetailResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Data tidak ditemukan
                data: null
                timestamp: '2026-10-30T10:00:00+07:00'

    post:
      tags: [Mahasiswa]
      summary: Menambahkan data mahasiswa (MahasiswaController::store)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaInput'
            example:
              nim: '220123'
              nama: Budi Santoso
              email: budi@example.com
              prodi_id: 1
              angkatan: 2022
              status: aktif
      responses:
        '201':
          description: Data berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                success: true
                message: Data berhasil ditambahkan
                data: { id: 14 }
                timestamp: '2026-10-30T10:00:00+07:00'
        '400':
          $ref: '#/components/responses/FieldWajib'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: NIM sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: NIM sudah terdaftar
                data: null
                errors: { nim: NIM sudah terdaftar }
                timestamp: '2026-10-30T10:00:00+07:00'
        '422':
          $ref: '#/components/responses/ValidasiGagal'

    put:
      tags: [Mahasiswa]
      summary: Mengubah data mahasiswa (MahasiswaController::update)
      description: Seluruh field wajib dikirim ulang, sama seperti POST.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdWajib'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaInput'
            example:
              nim: '251002'
              nama: Ani Wijaya Ubah
              email: aniwijaya@email.com
              prodi_id: 1
              angkatan: 2025
              status: aktif
      responses:
        '200':
          description: Data berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Data berhasil diperbarui
                data: null
                timestamp: '2026-10-30T10:00:00+07:00'
        '400':
          description: ID kosong/bukan angka, atau field wajib belum lengkap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: ID wajib diisi
                data: null
                timestamp: '2026-10-30T10:00:00+07:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: NIM dipakai mahasiswa lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: NIM sudah dipakai mahasiswa lain
                data: null
                errors: { nim: NIM sudah dipakai mahasiswa lain }
                timestamp: '2026-10-30T10:00:00+07:00'
        '422':
          $ref: '#/components/responses/ValidasiGagal'

    delete:
      tags: [Mahasiswa]
      summary: Menghapus data mahasiswa (MahasiswaController::destroy)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdWajib'
      responses:
        '200':
          description: Data berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Data berhasil dihapus
                data: null
                timestamp: '2026-10-30T10:00:00+07:00'
        '400':
          description: ID kosong atau bukan angka
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: ID wajib diisi
                data: null
                timestamp: '2026-10-30T10:00:00+07:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT dari POST /login, dikirim pada header
        Authorization: Bearer <token>. Kedaluwarsa dalam 5 menit.

  parameters:
    IdWajib:
      name: id
      in: query
      required: true
      description: ID mahasiswa (angka)
      schema: { type: integer, example: 1 }

  responses:
    Unauthorized:
      description: Token tidak ditemukan, tidak valid, atau kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tokenTidakAda:
              summary: Token tidak dikirim
              value:
                success: false
                message: Token tidak ditemukan
                data: null
                timestamp: '2026-10-30T10:00:00+07:00'
            tokenTidakValid:
              summary: Token salah atau kedaluwarsa
              value:
                success: false
                message: Token tidak valid atau kedaluwarsa
                data: null
                timestamp: '2026-10-30T10:00:00+07:00'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Data tidak ditemukan
            data: null
            timestamp: '2026-10-30T10:00:00+07:00'
    MethodNotAllowed:
      description: Method HTTP tidak diizinkan (hanya POST)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Method tidak diizinkan
            data: null
            timestamp: '2026-10-30T10:00:00+07:00'
    FieldWajib:
      description: Field wajib belum lengkap
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Field wajib belum lengkap
            data: null
            errors: { nama: Field nama wajib diisi }
            timestamp: '2026-10-30T10:00:00+07:00'
    ValidasiGagal:
      description: >
        Data lengkap tetapi gagal validasi. Kemungkinan isi errors:
        nim (bukan 6 digit angka), email (format salah),
        status (selain aktif/cuti/lulus), prodi_id (tidak ditemukan).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Validasi data gagal
            data: null
            errors: { nim: 'Format NIM tidak valid, harus 6 digit angka' }
            timestamp: '2026-10-30T10:00:00+07:00'

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, example: user01 }
        email: { type: string, format: email, example: user01@example.com }
        password:
          type: string
          format: password
          description: Disimpan dalam bentuk hash
          example: rahasia123

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password, example: rahasia123 }

    MahasiswaInput:
      type: object
      required: [nim, nama, email, prodi_id, angkatan]
      properties:
        nim:
          type: string
          pattern: '^\d{6}$'
          description: 6 digit angka, unik
          example: '220123'
        nama: { type: string, example: Budi Santoso }
        email: { type: string, format: email, example: budi@example.com }
        prodi_id:
          type: integer
          description: Harus ada pada tabel prodi
          example: 1
        angkatan: { type: integer, example: 2022 }
        status:
          type: string
          enum: [aktif, cuti, lulus]
          default: aktif

    Mahasiswa:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nim: { type: string, example: '251002' }
        nama: { type: string, example: Ani Wijaya Ubah }
        email: { type: string, example: aniwijaya@email.com }
        prodi_id: { type: integer, example: 1 }
        prodi: { type: string, example: Teknik Informatika }
        angkatan: { type: integer, example: 2025 }
        status: { type: string, enum: [aktif, cuti, lulus], example: aktif }

    BaseResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    SuccessResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { nullable: true, example: null }

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { nullable: true, example: null }
            errors:
              type: object
              additionalProperties: { type: string }
              description: Keterangan error per field (hanya muncul jika ada)

    IdResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id: { type: integer, example: 14 }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string }
                role: { type: string, example: user }

    MahasiswaListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Mahasiswa'

    MahasiswaDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Mahasiswa'