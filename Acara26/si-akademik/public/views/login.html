<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SI Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 55%, #64b5f6 100%);
        }
        .card-login { border: 0; border-radius: 1rem; box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, .25); }
        .logo { width: 64px; height: 64px; border-radius: 50%; background: #e3f2fd; color: #0d47a1; font-size: 2rem; }
        .btn-biru { background: #0d47a1; border-color: #0d47a1; color: #fff; }
        .btn-biru:hover { background: #1565c0; border-color: #1565c0; color: #fff; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
    <div class="card card-login w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="logo d-inline-flex align-items-center justify-content-center mb-3">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h4 class="fw-bold text-primary-emphasis mb-1">SI Akademik</h4>
                <p class="text-muted mb-0">Silakan login untuk melanjutkan</p>
            </div>

            <div id="alert-login" class="alert alert-danger d-none py-2" role="alert"></div>

            <form id="form-login" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Masukkan username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                    </div>
                </div>
                <button type="submit" id="btn-login" class="btn btn-biru w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
