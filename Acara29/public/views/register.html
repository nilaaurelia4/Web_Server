<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SI Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 55%, #64b5f6 100%);
        }
        .card-login { border: 0; border-radius: 1rem; box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, .25); }
        .logo { width: 64px; height: 64px; border-radius: 50%; background: #e3f2fd; color: #0d47a1; font-size: 2rem; }
        .btn-biru { background: #0d47a1; border-color: #0d47a1; color: #fff; }
        .btn-biru:hover { background: #1565c0; border-color: #1565c0; color: #fff; }
        .btn-biru:disabled { background: #0d47a1; border-color: #0d47a1; color: #fff; opacity: .65; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
    <div class="card card-login w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="logo d-inline-flex align-items-center justify-content-center mb-3">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h4 class="fw-bold text-primary-emphasis mb-1">Buat Akun Baru</h4>
                <p class="text-muted mb-0">Daftar untuk mengakses SI Akademik</p>
            </div>

            <form id="form-register" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Minimal 3 karakter" autocomplete="username" autofocus>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="nama@email.com" autocomplete="email">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Minimal 6 karakter" autocomplete="new-password">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="konfirmasi" class="form-label">Konfirmasi password</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="konfirmasi" name="konfirmasi" placeholder="Ulangi password" autocomplete="new-password">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>
                <button type="submit" id="btn-register" class="btn btn-biru w-100 py-2 mt-2">
                    <i class="bi bi-person-check me-1"></i> Daftar
                </button>
            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Sudah punya akun? <a href="login.html" class="fw-semibold text-decoration-none">Login</a>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="helper.js"></script>
    <script src="register.js"></script>
</body>
</html>
