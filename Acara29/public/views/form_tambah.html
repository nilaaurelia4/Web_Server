<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Mahasiswa | SI Akademik</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="form.css" rel="stylesheet">
</head>
<body>
    <script>
        // Lindungi halaman: tanpa token kembali ke login
        if (!localStorage.getItem("token")) { window.location.href = "login.html"; }
    </script>

    <header class="topbar">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <span class="mark"></span><span class="brand-name">SI Akademik</span>
            </div>
            <a href="dashboard.html" class="btn btn-kembali"><i class="bi bi-arrow-left me-1"></i>Kembali ke dashboard</a>
        </div>
    </header>

    <main class="container" style="max-width: 680px;">
        <div class="py-4">
            <h1 class="fs-2 mb-1">Tambah mahasiswa</h1>
            <p class="text-muted mb-0">Isi data mahasiswa baru, lalu simpan.</p>
        </div>

        <form id="form-mahasiswa" class="panel-form" novalidate>
            <div class="row g-3">
                <div class="col-md-5">
                    <label class="form-label" for="nim">NIM</label>
                    <input type="text" class="form-control" id="nim" name="nim" maxlength="6" inputmode="numeric" placeholder="6 digit angka">
                    <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-7">
                    <label class="form-label" for="nama">Nama</label>
                    <input type="text" class="form-control" id="nama" name="nama">
                    <div class="invalid-feedback"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email">
                    <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="prodi_id">Program studi</label>
                    <select class="form-select" id="prodi_id" name="prodi_id">
                        <option value="">Pilih prodi</option>
                        <option value="1">Teknik Informatika</option>
                        <option value="2">Sistem Informasi</option>
                        <option value="3">Teknik Komputer</option>
                        <option value="4">Manajemen Informatika</option>
                    </select>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="angkatan">Angkatan</label>
                    <input type="number" class="form-control" id="angkatan" name="angkatan" placeholder="2026">
                    <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="status">Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="aktif">Aktif</option>
                        <option value="cuti">Cuti</option>
                        <option value="lulus">Lulus</option>
                    </select>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="foto">Foto (JPG/PNG, maks 2MB, opsional)</label>
                    <input type="file" class="form-control" id="foto" name="foto" accept="image/png,image/jpeg">
                    <div class="invalid-feedback"></div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="dashboard.html" class="btn btn-outline-secondary">Batal</a>
                <button type="submit" id="btn-simpan" class="btn btn-biru">
                    <i class="bi bi-check-lg me-1"></i>Simpan
                </button>
            </div>
        </form>
    </main>

    <script src="config.js"></script>
    <script src="helper.js"></script>
    <script src="form_tambah.js"></script>
</body>
</html>
