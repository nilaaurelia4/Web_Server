<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SI Akademik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --navy: #0B2A6F;
            --blue: #1D4ED8;
            --sky: #E6EEFF;
            --paper: #F5F8FF;
            --ink: #0F1B3D;
            --muted: #5B6B8C;
            --amber: #F5B301;
            --line: #DCE5F7;
        }
        body { font-family: 'Figtree', system-ui, sans-serif; color: var(--ink); background: var(--paper); }
        h1, .stat-num { font-family: 'Bricolage Grotesque', 'Figtree', sans-serif; }

        /* ---------- Bilah atas ---------- */
        .topbar { background: var(--navy); color: #fff; padding: .8rem 0; }
        .brand-name { font-weight: 600; font-size: 1.1rem; }
        .mark { width: 22px; height: 22px; background: var(--amber); border-radius: 6px 6px 6px 0; display: inline-block; }
        .user-chip { display: flex; align-items: center; gap: .6rem; }
        .user-meta { display: flex; flex-direction: column; line-height: 1.2; font-size: .9rem; font-weight: 500; }
        .role-pill { font-size: .72rem; font-weight: 600; text-transform: capitalize; color: #BFD2FF; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--amber); color: var(--navy); font-weight: 700;
        }
        .avatar-sm { width: 30px; height: 30px; font-size: .85rem; background: var(--sky); color: var(--blue); flex-shrink: 0; }
        .btn-logout { border: 1.5px solid rgba(255,255,255,.4); color: #fff; border-radius: .6rem; padding: .35rem .9rem; font-weight: 500; }
        .btn-logout:hover { background: #fff; color: var(--navy); }

        /* ---------- Judul halaman ---------- */
        .page-head { padding: 2rem 0 1.25rem; }
        .page-head h1 { font-size: clamp(1.7rem, 3vw, 2.3rem); font-weight: 700; margin: 0; }
        .page-head p { color: var(--muted); margin: .25rem 0 0; }

        /* ---------- Strip statistik ---------- */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border: 1px solid var(--line); border-radius: 1rem; margin-bottom: 1.5rem; overflow: hidden; }
        .stat { padding: 1.4rem 1.6rem; }
        .stat + .stat { border-left: 1px solid var(--line); }
        .stat-num { font-size: 2.4rem; font-weight: 700; line-height: 1; color: var(--navy); text-transform: capitalize; }
        .stat-label { color: var(--muted); margin-top: .5rem; font-size: .95rem; }

        /* ---------- Tabel ---------- */
        .panel-tabel { background: #fff; border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; margin-bottom: 3rem; }
        .toolbar { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
        .cari { position: relative; flex: 1 1 260px; max-width: 360px; }
        .cari i { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .cari input { padding-left: 2.5rem; border: 1.5px solid var(--line); border-radius: .7rem; background: var(--paper); }
        .form-control:focus, .form-select:focus { border-color: var(--blue); box-shadow: 0 0 0 .25rem rgba(29,78,216,.15); }

        .btn-biru { background: var(--navy); border: 0; color: #fff; border-radius: .7rem; font-weight: 600; padding: .55rem 1.1rem; }
        .btn-biru:hover { background: var(--blue); color: #fff; }

        .tabel { margin: 0; }
        .tabel thead th { background: var(--sky); color: var(--navy); font-weight: 600; font-size: .9rem; border: 0; padding: .85rem 1rem; white-space: nowrap; }
        .tabel tbody td { padding: .85rem 1rem; border-color: var(--line); vertical-align: middle; }
        .tabel tbody tr:hover { background: #F0F5FF; }
        .tabel .nim { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--navy); }

        .pill { display: inline-block; padding: .22rem .7rem; border-radius: 999px; font-size: .78rem; font-weight: 600; text-transform: capitalize; }
        .pill-aktif { background: #DCFCE7; color: #166534; }
        .pill-cuti { background: #FEF3C7; color: #92400E; }
        .pill-lulus { background: #DBEAFE; color: #1E40AF; }

        .btn-ubah, .btn-hapus { border-radius: .55rem; font-weight: 500; }
        #kosong-cari { padding: 2rem; text-align: center; color: var(--muted); }

        /* ---------- Modal ---------- */
        .modal-content { border: 0; border-radius: 1rem; overflow: hidden; }
        .modal-header { background: var(--navy); color: #fff; border: 0; }
        .modal-title { font-family: 'Bricolage Grotesque', 'Figtree', sans-serif; font-weight: 700; }
        .form-control, .form-select { border: 1.5px solid var(--line); border-radius: .6rem; }

        @media (max-width: 720px) {
            .stats { grid-template-columns: 1fr; }
            .stat + .stat { border-left: 0; border-top: 1px solid var(--line); }
            .user-meta { display: none; }
        }
    </style>
</head>
<body>
    <!-- LANGKAH 4: lindungi view, tanpa token kembali ke login -->
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
    </script>

    <header class="topbar">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <span class="mark"></span><span class="brand-name">SI Akademik</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="user-chip">
                    <span class="avatar" id="avatar-user">A</span>
                    <span class="user-meta">
                        <span id="nama-user">-</span>
                        <span id="badge-role" class="role-pill">-</span>
                    </span>
                </div>
                <!-- TUGAS MANDIRI 1: tombol Logout -->
                <button id="btn-logout" class="btn btn-logout">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-head">
            <h1>Halo, <span id="sapaan-nama">pengguna</span></h1>
            <p id="tanggal"></p>
        </div>

        <div id="alert-dashboard" class="alert d-none" role="alert"></div>

        <!-- LANGKAH 5: ringkasan data -->
        <section class="stats">
            <div class="stat">
                <div class="stat-num" id="total-mahasiswa">0</div>
                <div class="stat-label">Total mahasiswa</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="total-aktif">0</div>
                <div class="stat-label">Mahasiswa aktif</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="info-role">-</div>
                <div class="stat-label">Hak akses Anda</div>
            </div>
        </section>

        <section class="panel-tabel">
            <div class="toolbar">
                <div class="cari">
                    <i class="bi bi-search"></i>
                    <input type="search" id="cari" class="form-control" placeholder="Cari nama, NIM, atau program studi">
                </div>
                <!-- TUGAS MANDIRI 2: elemen khusus admin diberi class aksi-admin -->
                <button class="btn btn-biru aksi-admin" id="btn-tambah">
                    <i class="bi bi-plus-lg me-1"></i>Tambah mahasiswa
                </button>
            </div>
            <div class="table-responsive">
                <table class="table tabel align-middle" id="tabel-mahasiswa">
                    <thead>
                        <tr>
                            <th>NIM</th><th>Nama</th><th>Email</th><th>Program Studi</th><th>Angkatan</th><th>Status</th>
                            <th class="text-center aksi-admin">Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="kosong-cari" class="d-none">Tidak ada data yang cocok dengan pencarian.</div>
        </section>
    </main>

    <!-- Modal Tambah / Ubah -->
    <div class="modal fade" id="modal-mahasiswa" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="form-mahasiswa" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="judul-modal">Tambah mahasiswa</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="mhs-id">
                    <div class="mb-3"><label class="form-label" for="mhs-nim">NIM</label>
                        <input type="text" class="form-control" id="mhs-nim" maxlength="6" placeholder="6 digit angka"></div>
                    <div class="mb-3"><label class="form-label" for="mhs-nama">Nama</label>
                        <input type="text" class="form-control" id="mhs-nama"></div>
                    <div class="mb-3"><label class="form-label" for="mhs-email">Email</label>
                        <input type="email" class="form-control" id="mhs-email"></div>
                    <div class="row g-3">
                        <div class="col-6"><label class="form-label" for="mhs-prodi">Program studi</label>
                            <select class="form-select" id="mhs-prodi">
                                <option value="">Pilih prodi</option>
                                <option value="1">Teknik Informatika</option>
                                <option value="2">Sistem Informasi</option>
                                <option value="3">Teknik Komputer</option>
                                <option value="4">Manajemen Informatika</option>
                            </select></div>
                        <div class="col-6"><label class="form-label" for="mhs-angkatan">Angkatan</label>
                            <input type="number" class="form-control" id="mhs-angkatan" placeholder="2025"></div>
                    </div>
                    <div class="mt-3"><label class="form-label" for="mhs-status">Status</label>
                        <select class="form-select" id="mhs-status">
                            <option value="aktif">Aktif</option>
                            <option value="cuti">Cuti</option>
                            <option value="lulus">Lulus</option>
                        </select></div>
                    <div id="error-form" class="alert alert-danger d-none mt-3 mb-0 py-2 small"></div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-biru">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
